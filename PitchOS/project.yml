name: PitchOS
options:
  bundleIdPrefix: com.pitchos
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

targets:
  PitchOS:
    type: application
    platform: iOS
    sources:
      - PitchOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PitchOS uses the microphone for voice-to-text note capture during calls."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "PitchOS uses speech recognition to transcribe your call notes."
        INFOPLIST_KEY_CFBundleDisplayName: "PitchOS"
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: SplashBackground
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: true
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: Supabase
        product: Supabase

  PitchOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PitchOSTests
    dependencies:
      - target: PitchOS
    settings:
      base:
        SWIFT_VERSION: "6.0"
